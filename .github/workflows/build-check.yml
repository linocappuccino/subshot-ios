name: iOS build check
# Compiles the app for the iOS Simulator on every push (no signing, no upload) so compile errors
# show up before the app is opened in Xcode.
on:
  push:
    branches: [master, main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          ls -d /Applications/Xcode*.app
          LATEST=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then sudo xcode-select -s "$LATEST"; fi
          xcodebuild -version
          xcodebuild -list -project Subshot.xcodeproj
      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild -project Subshot.xcodeproj -scheme Subshot \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Unit tests (simulator)
        run: |
          set -o pipefail
          SIM=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for rt in sorted(d, reverse=True) if ".iOS-" in rt for x in d[rt] if x["name"].startswith("iPhone")))')
          OS=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(rt.split(".iOS-")[1].replace("-",".") for rt in sorted(d, reverse=True) if ".iOS-" in rt and any(x["name"].startswith("iPhone") for x in d[rt])))')
          xcodebuild test -project Subshot.xcodeproj -scheme Subshot -destination "platform=iOS Simulator,id=$SIM" \
            -only-testing:SubshotTests -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= IPHONEOS_DEPLOYMENT_TARGET="$OS" \
            2>&1 | tee test.log | grep -E "Test (Case|case|Suite)|error:|TEST (SUCCEEDED|FAILED)|Executed" || true
          grep -q "TEST SUCCEEDED" test.log
      - name: Bundled fonts
        run: find ~/Library/Developer/Xcode/DerivedData -path "*Subshot.app/*" -iname "*.ttf" | sed 's#.*Subshot.app/#Subshot.app/#'
      - name: Errors
        if: failure()
        run: grep -n "error:" build.log | head -80 || true
